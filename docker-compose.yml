services:

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nginx-admin-backend
    restart: unless-stopped
    ports:
      - "4000:4000"   # HTTP API
      - "4001:4001"   # WebSocket
    environment:
      NODE_ENV:       production
      ADMIN_USER:     ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-cambiaresto}  # En producción.
      JWT_SECRET:     ${JWT_SECRET}
      PROJECTS_DIR:   ${PROJECTS_DIR:-/var/www}
      FRONTEND_URL:   ${FRONTEND_URL:-http://localhost:3000}
    volumes:
      - /etc/nginx:/etc/nginx                          # acceso a nginx
      - /etc/letsencrypt:/etc/letsencrypt              # certificados SSL
      - /var/www:/var/www                              # proyectos docker
      - /var/log/nginx:/var/log/nginx                  # logs nginx
      - /var/log/letsencrypt:/var/log/letsencrypt      # logs certbot
      - /var/run/docker.sock:/var/run/docker.sock      # control docker
      - /proc:/proc:ro
      - /sys:/sys:ro
    network_mode: host                                 # necesario para certbot y nginx reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nginx-admin-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NUXT_PUBLIC_API_URL: ${NUXT_PUBLIC_API_URL:-http://localhost:4000}
      NUXT_PUBLIC_WS_URL:  ${NUXT_PUBLIC_WS_URL:-ws://localhost:4001}
    depends_on:
      - backend